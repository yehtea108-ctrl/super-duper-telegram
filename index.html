<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>雙人協作飛機射擊</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family:-apple-system,sans-serif; background:#0a0a12; touch-action:none; }
  #lobby { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#fff; padding:20px; box-sizing:border-box; }
  #lobby input { font-size:24px; text-align:center; letter-spacing:8px; width:180px; padding:10px; border-radius:20px; border:none; }
  #lobby button { font-size:18px; padding:12px 24px; border-radius:24px; border:none; background:#3a7bd5; color:#fff; }
  #lobby .side-btn { display:flex; gap:12px; }
  #lobby .side-btn button { flex:1; background:#222; border:2px solid #444; border-radius:16px; }
  #lobby .side-btn button.selected { border-color:#3a7bd5; background:#1a3a5c; }
  #status { color:#aaa; font-size:14px; text-align:center; min-height:20px; }
  #game { position:absolute; inset:0; display:none; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:10px 16px; color:#fff; font-size:14px; pointer-events:none; }
  #controls { position:absolute; bottom:0; left:0; right:0; display:flex; height:130px; padding:8px 12px; box-sizing:border-box; gap:8px; }
  .skill-row { flex:1; display:flex; gap:10px; align-items:center; justify-content:center; }
  .skill-btn {
    position:relative; width:60px; height:60px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25);
    color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center;
    text-align:center; user-select:none; overflow:hidden;
  }
  .skill-btn .cd-overlay {
    position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(rgba(0,0,0,0.65) var(--pct,0%), transparent 0);
    pointer-events:none;
  }
  .skill-btn.ready { border-color:#3a7bd5; }
  #resultOverlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; background:rgba(0,0,0,0.75); color:#fff; z-index:10; }
  #resultOverlay button { font-size:16px; padding:10px 20px; border-radius:24px; border:none; background:#3a7bd5; color:#fff; }
  #pilotHint { position:absolute; top:34px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.5); font-size:12px; pointer-events:none; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="lobby">
  <h2 style="margin:0;">雙人協作飛機射擊</h2>
  <div>
    <div style="text-align:center; margin-bottom:8px; color:#aaa; font-size:14px;">房間代碼（雙方輸入同一組）</div>
    <input id="roomCode" maxlength="4" placeholder="0000" inputmode="numeric">
  </div>
  <div class="side-btn">
    <button id="btnLeft">左邊（火/水屬性）</button>
    <button id="btnRight">右邊（主駕）</button>
  </div>
  <button id="btnJoin">連線</button>
  <div id="status"></div>
</div>

<div id="game">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <span id="hpText">HP: 3</span>
    <span id="scoreText">分數: 0</span>
  </div>
  <div id="pilotHint"></div>
  <div id="controls">
    <div class="skill-row" id="skillRow"></div>
  </div>
  <div id="resultOverlay">
    <div id="resultText" style="font-size:28px;"></div>
    <button id="btnRestart">重新開始</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB2wAAQrplWWXR8r4feft1X6fjpV-omh_0",
  authDomain: "tttt-b6efa.firebaseapp.com",
  databaseURL: "https://tttt-b6efa-default-rtdb.firebaseio.com",
  projectId: "tttt-b6efa"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomCode = "";
let mySide = null;
let isHost = false;
let roomRef = null;

const lobby = document.getElementById('lobby');
const gameDiv = document.getElementById('game');
const statusEl = document.getElementById('status');
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.onclick = () => { mySide='left'; btnLeft.classList.add('selected'); btnRight.classList.remove('selected'); };
btnRight.onclick = () => { mySide='right'; btnRight.classList.add('selected'); btnLeft.classList.remove('selected'); };

document.getElementById('btnJoin').onclick = () => {
  const code = document.getElementById('roomCode').value.trim();
  if (!code) { statusEl.textContent = "請輸入房間代碼"; return; }
  if (!mySide) { statusEl.textContent = "請選擇你負責左邊還是右邊"; return; }
  roomCode = code;
  joinRoom();
};

function joinRoom() {
  roomRef = db.ref('games/' + roomCode);
  statusEl.textContent = "連線中...";
  roomRef.child('meta/hostClaimed').transaction(current => current === null ? true : current,
    (error, committed) => {
      isHost = committed;
      roomRef.child('players/' + mySide).set({ joined:true, ts:Date.now() });
      statusEl.textContent = "等待對方加入...";
      waitForBothPlayers();
    });
}

function waitForBothPlayers() {
  roomRef.child('players').on('value', snap => {
    const p = snap.val() || {};
    if (p.left && p.right) { startGame(); roomRef.child('players').off(); }
  });
}

// ===================== 技能定義 =====================

const SKILLS = {
  left: [
    { id:'fireball', label:'大火球', cd:3000, icon:'🔥' },
    { id:'homing',   label:'鳳仙花', cd:4000, icon:'✳' },
    { id:'dragon',   label:'水龍彈', cd:5500, icon:'🌊' }
  ],
  right: [
    { id:'tsukuyomi', label:'月讀', cd:6000, icon:'◐' },
    { id:'kamui',     label:'神威', cd:4500, icon:'◎' },
    { id:'amaterasu', label:'天照', cd:5000, icon:'◆' }
  ]
};

let cooldownUntil = {};
let skillButtons = {};

function buildSkillUI() {
  const row = document.getElementById('skillRow');
  row.innerHTML = '';
  const mySkills = SKILLS[mySide];
  mySkills.forEach(s => {
    const btn = document.createElement('div');
    btn.className = 'skill-btn ready';
    btn.innerHTML = '<div class="cd-overlay" style="--pct:0%"></div><div style="position:relative;z-index:1;">' + s.icon + '<br>' + s.label + '</div>';
    btn.addEventListener('touchstart', e => { e.preventDefault(); triggerSkill(s); });
    btn.addEventListener('click', () => triggerSkill(s));
    row.appendChild(btn);
    skillButtons[s.id] = btn;
    cooldownUntil[s.id] = 0;
  });

  document.getElementById('pilotHint').textContent =
    mySide === 'right' ? '按住飛機拖曳移動' : '';
}

function triggerSkill(skill) {
  const now = Date.now();
  if (now < cooldownUntil[skill.id]) return;
  cooldownUntil[skill.id] = now + skill.cd;
  roomRef.child('input/' + mySide + '/skillRequest').set({ id: skill.id, ts: now });
}

function updateCooldownUI() {
  const now = Date.now();
  const mySkills = SKILLS[mySide];
  mySkills.forEach(s => {
    const remain = cooldownUntil[s.id] - now;
    const btn = skillButtons[s.id];
    const overlay = btn.querySelector('.cd-overlay');
    if (remain > 0) {
      const pct = Math.round((remain / s.cd) * 100);
      overlay.style.setProperty('--pct', pct + '%');
      btn.classList.remove('ready');
    } else {
      overlay.style.setProperty('--pct', '0%');
      btn.classList.add('ready');
    }
  });
  requestAnimationFrame(updateCooldownUI);
}

// ===================== 遊戲主體 =====================

let canvas, ctx, W, H;
let plane = { x:0.5, hp:3 };
let bullets = [];   // {x,y,type,vx,vy,targetIdx}
let enemies = [];   // {x,y,frozen,burning,burnUntil}
let effects = [];   // 視覺特效 {type,x,y,until}
let score = 0;
let gameOver = false;
let gameStartTs = 0;
let lastEnemySpawn = 0;
let freezeUntil = 0;

function startGame() {
  lobby.style.display = 'none';
  gameDiv.style.display = 'block';
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  buildSkillUI();
  updateCooldownUI();
  setupPlaneDrag();

  roomRef.child('input/' + mySide).set({ dir:0, fireRequest:0, skillRequest:null });

  if (isHost) {
    gameStartTs = Date.now();
    roomRef.child('state').set({ planeX:0.5, hp:3, score:0, enemies:[], bullets:[], effects:[], over:false });
    requestAnimationFrame(gameLoop);
  } else {
    roomRef.child('state').on('value', snap => {
      const s = snap.val();
      if (!s) return;
      plane.x = s.planeX; plane.hp = s.hp; score = s.score;
      bullets = s.bullets || []; enemies = s.enemies || []; effects = s.effects || [];
      gameOver = s.over;
      render();
      if (gameOver) showResult();
    });
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight - 130;
  canvas.style.height = H + 'px';
}

// 只有右邊(主駕)可以按住飛機拖曳移動
function setupPlaneDrag() {
  if (mySide !== 'right') return;
  let dragging = false;

  function isNearPlane(clientX, clientY) {
    const px = plane.x * W;
    const py = H * 0.85;
    return Math.abs(clientX - px) < 45 && Math.abs(clientY - py) < 45;
  }

  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (isNearPlane(t.clientX, t.clientY)) dragging = true;
  });
  canvas.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    const ratio = Math.min(Math.max(t.clientX / W, 0.05), 0.95);
    roomRef.child('input/right/dir').set(ratio);
  });
  canvas.addEventListener('touchend', () => { dragging = false; });

  canvas.addEventListener('mousedown', e => { if (isNearPlane(e.clientX, e.clientY)) dragging = true; });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const ratio = Math.min(Math.max(e.clientX / W, 0.05), 0.95);
    roomRef.child('input/right/dir').set(ratio);
  });
  window.addEventListener('mouseup', () => { dragging = false; });
}

// ===================== Host 遊戲邏輯 =====================

let inputCache = { left:{}, right:{} };
let lastFireHandled = { left:0, right:0 };
let lastSkillHandled = { left:0, right:0 };

function gameLoop(ts) {
  if (!isHost || gameOver) return;

  roomRef.child('input').once('value', snap => { inputCache = snap.val() || inputCache; });

  // 移動：只有 right 的 dir 有效（絕對比例位置）
  if (inputCache.right && typeof inputCache.right.dir === 'number' && inputCache.right.dir > 0) {
    plane.x += (inputCache.right.dir - plane.x) * 0.35;
  }
  plane.x = Math.min(Math.max(plane.x, 0.05), 0.95);

  // 左邊技能
  const leftSkill = inputCache.left && inputCache.left.skillRequest;
  if (leftSkill && leftSkill.ts > lastSkillHandled.left) {
    lastSkillHandled.left = leftSkill.ts;
    applyLeftSkill(leftSkill.id);
  }

  // 右邊技能
  const rightSkill = inputCache.right && inputCache.right.skillRequest;
  if (rightSkill && rightSkill.ts > lastSkillHandled.right) {
    lastSkillHandled.right = rightSkill.ts;
    applyRightSkill(rightSkill.id);
  }

  const now = Date.now();
  const frozen = now < freezeUntil;

  // 子彈移動
  bullets.forEach(b => {
    if (b.type === 'homing') {
      const target = findNearestEnemy(b.x, b.y);
      if (target) {
        const dx = target.x - b.x, dy = target.y - b.y;
        const dist = Math.hypot(dx, dy) || 1;
        b.x += (dx / dist) * 0.018;
        b.y += (dy / dist) * 0.018;
      } else {
        b.y -= 0.02;
      }
    } else {
      b.y -= (b.speed || 0.02);
    }
  });
  bullets = bullets.filter(b => b.y > -0.1 && b.y < 1.1);

  // 難度隨時間漸進：生成間隔從 1200ms 降到最低 500ms
  const elapsed = now - gameStartTs;
  const spawnInterval = Math.max(500, 1200 - elapsed / 60);
  if (ts - lastEnemySpawn > spawnInterval) {
    lastEnemySpawn = ts;
    enemies.push({ x: 0.1 + Math.random()*0.8, y:-0.05, frozen:false, burning:false });
  }

  // 敵人移動速度也隨時間微幅提升
  const enemySpeed = Math.min(0.012, 0.006 + elapsed / 400000);
  if (!frozen) {
    enemies.forEach(en => { if (!en.frozen) en.y += enemySpeed; });
  }

  // 燃燒中的敵人：burnUntil 到了就移除並加分
  for (let i = enemies.length-1; i>=0; i--) {
    if (enemies[i].burning && now > enemies[i].burnUntil) {
      enemies.splice(i,1); score += 15;
    }
  }

  // 子彈打敵人（含大火球大範圍、水龍彈穿透）
  for (let j = bullets.length-1; j>=0; j--) {
    const b = bullets[j];
    const radius = b.type === 'fireball' ? 0.09 : (b.type === 'dragon' ? 0.07 : 0.04);
    let hitOne = false;
    for (let i = enemies.length-1; i>=0; i--) {
      if (enemies[i].burning) continue;
      const dx = enemies[i].x - b.x, dy = enemies[i].y - b.y;
      if (Math.hypot(dx,dy) < radius) {
        enemies.splice(i,1);
        score += 10;
        hitOne = true;
        if (b.type !== 'dragon') break; // 水龍彈可以穿透打多隻，其餘擊中一隻就消失
      }
    }
    if (hitOne && b.type !== 'dragon') bullets.splice(j,1);
  }

  // 敵人撞到飛機
  for (let i = enemies.length-1; i>=0; i--) {
    if (!enemies[i].burning && Math.abs(enemies[i].x - plane.x) < 0.05 && enemies[i].y > 0.8) {
      enemies.splice(i,1);
      plane.hp -= 1;
    }
  }

  effects = effects.filter(e => now < e.until);

  if (plane.hp <= 0) gameOver = true;

  roomRef.child('state').set({
    planeX: plane.x, hp: plane.hp, score, enemies, bullets, effects, over: gameOver
  });

  render();
  if (gameOver) { showResult(); return; }
  requestAnimationFrame(gameLoop);
}

function findNearestEnemy(x, y) {
  let best = null, bestDist = Infinity;
  enemies.forEach(en => {
    if (en.burning) return;
    const d = Math.hypot(en.x-x, en.y-y);
    if (d < bestDist) { bestDist = d; best = en; }
  });
  return best;
}

function applyLeftSkill(id) {
  const now = Date.now();
  if (id === 'fireball') {
    bullets.push({ x:plane.x, y:0.82, type:'fireball', speed:0.012 });
  } else if (id === 'homing') {
    bullets.push({ x:plane.x, y:0.82, type:'homing' });
  } else if (id === 'dragon') {
    bullets.push({ x:plane.x, y:0.82, type:'dragon', speed:0.016 });
    effects.push({ type:'dragon', x:plane.x, y:0.82, until: now+800 });
  }
}

function applyRightSkill(id) {
  const now = Date.now();
  if (id === 'tsukuyomi') {
    freezeUntil = now + 2500;
    effects.push({ type:'freeze', x:0.5, y:0.4, until: now+400 });
  } else if (id === 'kamui') {
    // 移除最靠近飛機（最下方）的一隻小怪
    let target = null, maxY = -1;
    enemies.forEach(en => { if (!en.burning && en.y > maxY) { maxY = en.y; target = en; } });
    if (target) {
      effects.push({ type:'kamui', x:target.x, y:target.y, until: now+400 });
      enemies = enemies.filter(en => en !== target);
      score += 10;
    }
  } else if (id === 'amaterasu') {
    let target = null, maxY = -1;
    enemies.forEach(en => { if (!en.burning && en.y > maxY) { maxY = en.y; target = en; } });
    if (target) { target.burning = true; target.burnUntil = now + 1000; }
  }
}

// ===================== 畫面渲染 =====================

function render() {
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0,0,W,H);

  document.getElementById('hpText').textContent = 'HP: ' + plane.hp;
  document.getElementById('scoreText').textContent = '分數: ' + score;

  // 飛機：導航圖標造型（圓角三角箭頭）
  const px = plane.x*W, py = H*0.85;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = '#3a7bd5';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.quadraticCurveTo(16, 10, 6, 10);
  ctx.quadraticCurveTo(0, 4, -6, 10);
  ctx.quadraticCurveTo(-16, 10, 0, -22);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#dff0ff';
  ctx.beginPath();
  ctx.arc(0, -4, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // 子彈
  bullets.forEach(b => {
    ctx.beginPath();
    if (b.type === 'fireball') { ctx.fillStyle = '#ff6a1a'; ctx.arc(b.x*W, b.y*H, 14, 0, Math.PI*2); }
    else if (b.type === 'homing') { ctx.fillStyle = '#ffd166'; ctx.arc(b.x*W, b.y*H, 8, 0, Math.PI*2); }
    else if (b.type === 'dragon') { ctx.fillStyle = '#2ec4ff'; ctx.arc(b.x*W, b.y*H, 12, 0, Math.PI*2); }
    else { ctx.fillStyle = '#00e5ff'; ctx.rect(b.x*W-3, b.y*H-8, 6, 16); }
    ctx.fill();
  });

  // 敵人（燃燒中變紅橘漸層）
  enemies.forEach(en => {
    ctx.beginPath();
    ctx.fillStyle = en.burning ? '#ff3d00' : (en.frozen ? '#8ecae6' : '#e24b4a');
    ctx.arc(en.x*W, en.y*H, 16, 0, Math.PI*2);
    ctx.fill();
  });

  // 特效
  const now = Date.now();
  effects.forEach(e => {
    const life = (e.until - now) / 400;
    ctx.globalAlpha = Math.max(0, life);
    if (e.type === 'freeze') {
      ctx.strokeStyle = '#8ecae6'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(W/2, H*0.4, 60*(1.5-life), 0, Math.PI*2); ctx.stroke();
    } else if (e.type === 'kamui') {
      ctx.strokeStyle = '#b39ddb'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x*W, e.y*H, 20*(1.5-life), 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}

function showResult() {
  const overlay = document.getElementById('resultOverlay');
  document.getElementById('resultText').textContent = '飛機被擊落了（分數 ' + score + '）';
  overlay.style.display = 'flex';
}

document.getElementById('btnRestart').onclick = () => location.reload();
</script>
</body>
</html>
